[package]
name = "atom-kernel"
license = "Apache-2.0"
publish = false
version = "0.2.0"
authors = ["Pedro Lucas <@fpedrolucas95>"]
edition = "2021"
description = "Um microkernel experimental baseado em capacidades escrito em Rust."
repository = "https://github.com/fpedrolucas95/Atom"

[lib]
name = "atom"
path = "src/kernel.rs"
crate-type = ["staticlib"]
test = false
bench = false
doctest = false

[features]
default = []
syscall-frame-debug = []
# Audit log size configuration features
# These features allow compile-time configuration of the capability audit log size
audit_log_entries_100 = []    # Low memory systems (100 entries ≈ 6.4 KB)
audit_log_entries_500 = []    # Constrained systems (500 entries ≈ 32 KB)
audit_log_entries_5000 = []   # High security systems (5000 entries ≈ 320 KB)
audit_log_entries_10000 = []  # Development/debugging (10000 entries ≈ 640 KB)

[dependencies]
spin = "0.9"
x86_64 = "0.14"
atom_abi = { path = "../shared/abi" }
atom_atxf = { path = "../shared/atxf" }
sha2 = { version = "0.10", default-features = false, features = ["force-soft"] }
