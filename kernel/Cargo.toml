[package]
name = "atom-kernel"
version = "0.1.0"
authors = ["Pedro Lucas <@fpedrolucas95>"]
edition = "2021"
description = "Um microkernel experimental baseado em capacidades escrito em Rust."
repository = "https://github.com/fpedrolucas95/Atom"

[lib]
name = "atom"
path = "src/kernel.rs"
crate-type = ["staticlib"]
test = false
bench = false
doctest = false

[features]
# Activates the kernel-level preemptive scheduler stress test.
# Build: cargo build -p atom-kernel --release --features stress_test
stress_test = []

[dependencies]
spin = "0.9"
x86_64 = "0.14"
atom_abi = { path = "../shared/abi" }