[package]
name = "terminal"
version = "0.1.0"
edition = "2021"
description = "Atom OS userspace terminal emulator"

# Exclude from parent workspace
[workspace]

[dependencies]
atom_abi = { path = "../../../shared/abi" }
atom_syscall = { path = "../../libs/syscall" }
libipc = { path = "../../libs/libipc" }
libnet = { path = "../../libs/libnet" }

[[bin]]
name = "terminal"
path = "src/main.rs"