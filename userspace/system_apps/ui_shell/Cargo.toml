[package]
name = "atom_desktop"
version = "0.1.0"
edition = "2021"
authors = ["Atom OS Contributors"]
description = "Atom Desktop Environment - Compositor and Window Manager"

[dependencies]
atom_syscall = { path = "../../libs/syscall" }
libsvg       = { path = "../../libs/libsvg" }
atom_theme   = { path = "../../libs/atom_theme" }
libipc       = { path = "../../libs/libipc" }
libgui       = { path = "../../libs/libgui" }

[[bin]]
name = "atom_desktop"
path = "src/main.rs"
